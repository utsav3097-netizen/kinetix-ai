services:
  - type: web
    name: kinetix-web
    runtime: docker
    branch: feature/aws-android-scale
    region: singapore
    plan: 1c-2g
    autoDeployTrigger: commit
    healthCheckPath: /api/v1/health/live
    preDeployCommand: alembic upgrade head && python -m app.seed
    scaling:
      minInstances: 2
      maxInstances: 10
      targetCPUPercent: 60
    envVars:
      - key: APP_ENV
        value: production
      - key: FORWARDED_ALLOW_IPS
        value: '*'
      - key: DATABASE_URL
        fromDatabase:
          name: kinetix-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '[]'
      - key: DB_POOL_SIZE
        value: '2'
      - key: DB_MAX_OVERFLOW
        value: '1'
      - key: DB_POOL_TIMEOUT
        value: '5'
      - key: RUN_AI_WORKER
        value: 'false'
      - fromGroup: kinetix-runtime

  - type: worker
    name: kinetix-ai-worker
    runtime: docker
    branch: feature/aws-android-scale
    region: singapore
    plan: 0.5c-512mb
    autoDeployTrigger: commit
    dockerCommand: python -m app.worker_main
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kinetix-db
          property: connectionString
      - key: DB_POOL_SIZE
        value: '2'
      - key: DB_MAX_OVERFLOW
        value: '1'
      - key: DB_POOL_TIMEOUT
        value: '5'
      - key: RUN_AI_WORKER
        value: 'true'
      - fromGroup: kinetix-runtime

databases:
  - name: kinetix-db
    databaseName: kinetix
    user: kinetix
    postgresMajorVersion: '17'
    region: singapore
    plan: 1c-2g
    diskSizeGB: 20
    storageAutoscalingEnabled: true
    ipAllowList: []

envVarGroups:
  - name: kinetix-runtime
    envVars:
      - key: JWT_SECRET
        generateValue: true
