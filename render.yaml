services:
  - type: web
    name: kinetix-ai-fitness-web
    runtime: docker
    branch: feature/aws-android-scale
    region: singapore
    plan: free
    autoDeployTrigger: commit
    numInstances: 1
    healthCheckPath: /api/v1/health/live
    dockerCommand: sh /app/backend/render-start.sh
    envVars:
      - key: APP_ENV
        value: production
      - key: FORWARDED_ALLOW_IPS
        value: '*'
      - key: DATABASE_URL
        fromDatabase:
          name: kinetix-ai-fitness-db
          property: connectionString
      - key: CORS_ORIGINS
        value: '[]'
      - key: DB_POOL_SIZE
        value: '4'
      - key: DB_MAX_OVERFLOW
        value: '2'
      - key: DB_POOL_TIMEOUT
        value: '5'
      - key: RUN_AI_WORKER
        value: 'true'
      - fromGroup: kinetix-ai-fitness-runtime

databases:
  - name: kinetix-ai-fitness-db
    databaseName: kinetix
    user: kinetix
    postgresMajorVersion: '17'
    region: singapore
    plan: free
    ipAllowList: []

envVarGroups:
  - name: kinetix-ai-fitness-runtime
    envVars:
      - key: JWT_SECRET
        generateValue: true
