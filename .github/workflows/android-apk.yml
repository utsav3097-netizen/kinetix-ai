name: Build KINETIX Android APK

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  push:
    branches: ['feature/aws-android-scale']
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:
    inputs:
      app_url:
        description: Deployed Render HTTPS origin, such as https://kinetix-web.onrender.com
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        env:
          KINETIX_PUBLIC_URL: ${{ inputs.app_url || 'https://kinetix-placeholder.onrender.com' }}
        run: gradle --no-daemon --project-dir android testDebugUnitTest assembleDebug -PKINETIX_PUBLIC_URL="$KINETIX_PUBLIC_URL" -PKINETIX_VERSION_CODE="${{ github.run_number }}"
      - name: Upload installable APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: kinetix-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
