services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kinetix
      POSTGRES_USER: kinetix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kinetix -d kinetix"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://kinetix:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/kinetix
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://kinetix:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/kinetix
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres_data:
